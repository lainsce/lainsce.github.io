<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F2F2F2">
    <link rel="shortcut icon" href="/favicons/favicon.ico">
    <script src="/scripts/theme.js"></script>
    <link rel="stylesheet" href="/scss/main.css">
    <title>404 — Lainsce</title>
</head>
<body class="error-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main class="error-shell" id="main-content">
        <header class="site-header">
            <div class="brand" aria-label="Lainsce home">
                <span class="brand-mark" aria-hidden="true"><img src="/images/LNS_BW.png" alt=""></span>
                <span class="brand-name">lainsce</span>
            </div>
            <div class="header-meta" role="group" aria-label="Display settings">
                <button class="contrast-toggle" id="contrast-toggle" type="button" aria-pressed="false" aria-label="Enable high contrast mode">
                    <span class="contrast-toggle-mark" aria-hidden="true">HC</span>
                    <span class="contrast-toggle-label">High contrast</span>
                </button>
                <label class="theme-picker">
                    <span class="sr-only">Color theme</span>
                    <select id="theme-picker" name="theme">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                    <span class="theme-picker-chevron" aria-hidden="true"></span>
                </label>
                <span class="site-copyright">© 2026</span>
            </div>
        </header>

        <section class="error-panel" aria-labelledby="error-title">
            <p class="eyebrow"><span class="eyebrow-index">404</span> Lost in the workspace</p>
            <h1 id="error-title">That page<br><em>isn't here.</em></h1>
            <p>The address may have changed, or this little corner of the site has not been built yet.</p>
            <div class="error-actions">
                <a class="button button-primary" href="/">Return home <span aria-hidden="true">↗</span></a>
                <a class="text-link" href="https://github.com/lainsce?tab=repositories" target="_blank" rel="noreferrer">Browse the repo <span aria-hidden="true">↗</span></a>
            </div>
        </section>
    </main>
</body>
</html>
